<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dâng lễ online</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Segoe UI",Roboto,Arial,sans-serif; color:#fff; min-height:100vh;
    background:radial-gradient(ellipse at top, #7a1010, #2a0303 70%); }
  .wrap { max-width:560px; margin:0 auto; padding:16px; }
  header { text-align:center; padding:18px 0 8px; }
  header h1 { margin:0; color:#f5c542; font-size:26px; text-shadow:0 0 12px #ffb30088; }
  header p { margin:4px 0 0; color:#ffe6a8; letter-spacing:3px; }
  .card { background:rgba(0,0,0,.35); border:2px solid #d4a017; border-radius:14px; padding:16px; margin:14px 0; }
  h2 { color:#f5c542; font-size:18px; margin:0 0 12px; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .item { background:#4a0b0b; border:2px solid #6d1a1a; border-radius:12px; padding:12px 8px; text-align:center; cursor:pointer; color:#fff; font:inherit; }
  .item.sel { border-color:#f5c542; background:#7a1414; box-shadow:0 0 14px #f5c54266; }
  .item .n { font-weight:700; margin-top:6px; }
  .item .p { color:#f5c542; font-size:15px; }
  label { display:block; margin:10px 0 4px; color:#ffe6a8; font-size:14px; }
  input, textarea { width:100%; padding:11px; border-radius:10px; border:1px solid #d4a017; background:#1d0202; color:#fff; font:inherit; }
  button.main { width:100%; margin-top:14px; padding:14px; font-size:18px; font-weight:700; border:0; border-radius:12px; cursor:pointer;
    background:linear-gradient(#ffd966,#d4a017); color:#5a0000; }
  #pay { display:none; text-align:center; }
  #pay img { width:100%; max-width:320px; aspect-ratio:1; object-fit:contain; background:#fff; border-radius:12px; padding:6px; }
  .code { font-size:26px; font-weight:800; color:#f5c542; letter-spacing:2px; }
  .muted { color:#ccc; font-size:14px; }
  #done { display:none; text-align:center; font-size:20px; color:#9effa0; }
  #feed div { padding:6px 0; border-bottom:1px dashed #d4a01744; font-size:15px; }
  .err { color:#ff9a9a; }
</style>
</head>
<body>
<div class="wrap">
  <header><h1 id="name">🛕</h1><p id="slogan"></p></header>

  <div class="card" id="form">
    <h2>1. Chọn lễ dâng</h2>
    <div class="grid" id="items"></div>
    <div id="freeBox" style="display:none">
      <label>Số tiền công đức (đ)</label>
      <input id="amount" type="number" min="1000" step="1000" placeholder="VD: 100000">
    </div>
    <h2 style="margin-top:16px">2. Thông tin</h2>
    <label>Tên Phật tử (hiện trên livestream)</label>
    <input id="donor" maxlength="40" placeholder="VD: Gia đình Nguyễn Văn A">
    <label>Lời nguyện cầu (tùy chọn)</label>
    <textarea id="wish" maxlength="120" rows="2" placeholder="VD: Cầu cho bố mẹ mạnh khỏe"></textarea>
    <button class="main" id="go">🙏 Dâng lễ</button>
    <p class="err" id="err"></p>
  </div>

  <div class="card" id="pay">
    <h2>3. Quét mã để hoàn tất</h2>
    <img id="qr" alt="Mã QR chuyển khoản" onerror="this.alt='Không tải được QR — hãy chuyển khoản thủ công theo thông tin bên dưới'">
    <p class="muted" id="bankInfo"></p>
    <p>Số tiền: <b id="payAmount"></b></p>
    <p>Nội dung chuyển khoản (giữ nguyên):<br><span class="code" id="payCode"></span></p>
    <p class="muted">Mở app ngân hàng → Quét QR. Lễ sẽ hiện lên livestream ngay khi nhà chùa nhận được.</p>
    <div id="done">✅ Lễ của bạn đã được dâng lên!<br>Nam Mô A Di Đà Phật 🙏</div>
  </div>

  <div class="card"><h2>🪷 Lễ vừa dâng</h2><div id="feed"></div></div>
</div>

<script src="common.js"></script>
<script>
let selected = null, myCode = null;

(async () => {
  const cfg = await LC.loadConfig();
  document.title = 'Dâng lễ - ' + cfg.templeName;
  document.getElementById('name').textContent = '🛕 ' + cfg.templeName;
  document.getElementById('slogan').textContent = cfg.slogan;

  const box = document.getElementById('items');
  for (const it of cfg.items) {
    const b = LC.el('button', 'item');
    b.innerHTML = LC.icon(it, 40);
    b.append(LC.el('div', 'n', it.name), LC.el('div', 'p', it.price ? LC.vnd(it.price) : 'Tùy tâm'));
    b.onclick = () => {
      selected = it;
      box.querySelectorAll('.item').forEach(x => x.classList.remove('sel'));
      b.classList.add('sel');
      document.getElementById('freeBox').style.display = it.price ? 'none' : 'block';
    };
    box.append(b);
  }

  const st = await (await fetch('/api/state')).json();
  st.donations.slice(-8).reverse().forEach(addFeed);

  LC.listen({
    donation: ({ donation, test }) => {
      if (test) return;
      addFeed(donation, true);
      if (myCode && donation.code === myCode) {
        document.getElementById('done').style.display = 'block';
        LC.bell(0.4);
      }
    },
  });
})();

function addFeed(d, top) {
  const feed = document.getElementById('feed');
  const row = LC.el('div', '', `🙏 ${d.name} — ${LC.item(d.itemId).name}${d.wish ? ': “' + d.wish + '”' : ''}`);
  top ? feed.prepend(row) : feed.append(row);
}

document.getElementById('go').onclick = async () => {
  const err = document.getElementById('err'); err.textContent = '';
  if (!selected) return (err.textContent = 'Vui lòng chọn một lễ dâng.');
  const body = {
    itemId: selected.id,
    amount: document.getElementById('amount').value,
    name: document.getElementById('donor').value,
    wish: document.getElementById('wish').value,
  };
  const r = await fetch('/api/order', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const o = await r.json();
  if (!r.ok) return (err.textContent = o.error);
  myCode = o.code;
  document.getElementById('qr').src = LC.qrUrl(o.amount, o.code);
  const bk = LC.config.bank;
  document.getElementById('bankInfo').textContent = `${bk.bankCode} • ${bk.accountNo} • ${bk.accountName}`;
  document.getElementById('payAmount').textContent = LC.vnd(o.amount);
  document.getElementById('payCode').textContent = o.code;
  document.getElementById('form').style.display = 'none';
  document.getElementById('pay').style.display = 'block';
  LC.bell(0.3);
};
</script>
</body>
</html>
